name: CI

# Validate every change; deploy main to production. Before deploying, attest
# sh/*.sh so anyone can check a downloaded script came from this workflow:
# `gh attestation verify <file> --repo taraxvoid/txv.sh`, or txv.sh/verify.
# sh/verify.sh pins this file's path as the signer, so keep the attest step
# in ci.yml.
#
# Links come from taraxvoid/infra's redirects.ts (private), read at deploy
# time with a GitHub App token that can only read that repo. infra's CI runs
# this workflow (workflow_dispatch on main) when the links change.

on:
    push:
        branches: [main]
    pull_request:
        types: [opened, synchronize, reopened, ready_for_review]
    workflow_dispatch:

permissions:
    contents: read

jobs:
    validate:
        uses: taraxvoid/voidflow/.github/workflows/tool-ci.yml@5693c9455d52f7fa419ff4be747c218bac3814f8 # v0.16.0
        permissions:
            contents: read
            pull-requests: read

    deploy:
        name: Deploy [prod]
        needs: validate
        # Never from a fork or a PR: an attestation from this job means "reviewed
        # and on main". workflow_dispatch on main is infra's links redeploy; it
        # builds the same reviewed commit.
        if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/main' && vars.CLOUDFLARE_ACCOUNT_ID != ''
        runs-on: ubuntu-latest
        timeout-minutes: 10
        environment: prod
        concurrency:
            group: deploy-prod
            cancel-in-progress: false
        permissions:
            contents: read
            id-token: write # sign the attestation (Sigstore)
            attestations: write
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  persist-credentials: false

            - uses: jdx/mise-action@2d8d4cafcbd33be2ea37d2b6f5ad595363d1f1ca # v5.1.1

            - run: bun install --frozen-lockfile

            # Logs counts only: destinations never reach this public log.
            - name: Build links
              uses: taraxvoid/voidlink/actions/build-links@336be623f32701d4899a1ddae8c4618a41268b42 # unreleased: pin to a voidlink release
              with:
                  redirects-repo: taraxvoid/infra
                  app-client-id: ${{ vars.LINKS_BOT_CLIENT_ID }}
                  app-private-key: ${{ secrets.LINKS_BOT_PRIVATE_KEY }}

            # Before the deploy, so no script is ever served without one.
            - name: Attest scripts
              uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
              with:
                  subject-path: sh/*.sh

            - uses: taraxvoid/voidflow/actions/cloudflare-deploy@5693c9455d52f7fa419ff4be747c218bac3814f8 # v0.16.0
              with:
                  env: prod
                  cloudflare-api-token: ${{ secrets.CLOUDFLARE_API_TOKEN }}
                  cloudflare-account-id: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
                  command: deploy
