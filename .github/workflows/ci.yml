name: CI

# Validate every change; deploy main to production. Before deploying, attest
# sh/*.sh so anyone can check a downloaded script came from this workflow:
# `gh attestation verify <file> --repo taraxvoid/txv.sh`, or txv.sh/verify.
# sh/verify.sh pins this file's path as the signer, so keep the attest step
# in ci.yml.
#
# Links come from taraxvoid/infra's redirects.ts (private), read at deploy
# time with a GitHub App token that can only read that repo. infra's CI runs
# this workflow (workflow_dispatch on main) when the links change.

on:
    push:
        branches: [main]
    pull_request:
        types: [opened, synchronize, reopened, ready_for_review]
    workflow_dispatch:

permissions:
    contents: read

jobs:
    validate:
        uses: taraxvoid/voidflow/.github/workflows/tool-ci.yml@6debbf253b3514375d712af47d1007546bd7b79a # v1.5.0
        permissions:
            contents: read
            pull-requests: read

    deploy:
        name: Deploy [prod]
        needs: validate
        # Never from a fork or a PR: an attestation from this job means "reviewed
        # and on main". workflow_dispatch on main is infra's links redeploy; it
        # builds the same reviewed commit.
        if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/main' && vars.CLOUDFLARE_ACCOUNT_ID != ''
        runs-on: ubuntu-latest
        timeout-minutes: 10
        environment: prod
        concurrency:
            group: deploy-prod
            cancel-in-progress: false
        permissions:
            contents: read
            id-token: write # sign the attestation (Sigstore)
            attestations: write
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  persist-credentials: false

            - uses: jdx/mise-action@924e7c586e33d7d4bae9c14e26c5d22e2beb6e78 # v5.3.0

            - run: bun install --frozen-lockfile

            # Before the deploy, so no script is ever served without one.
            - name: Attest scripts
              uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
              with:
                  subject-path: sh/*.sh

            - uses: taraxvoid/voidflow/actions/cloudflare-deploy@6debbf253b3514375d712af47d1007546bd7b79a # v1.5.0
              with:
                  env: prod
                  cloudflare-api-token: ${{ secrets.CLOUDFLARE_API_TOKEN }}
                  cloudflare-account-id: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
                  command: deploy
