# Written by voidflow v1.5.0: https://www.npmjs.com/package/@taraxvoid/voidflow
# Set up a repo the same way: npx @taraxvoid/voidflow init --kind tool --apply
# Checks GitHub against voidflow.config.ts after each push to main and weekly,
# and keeps one issue open while they differ (closed once back in sync).
# Review with `voidflow plan`, then `voidflow apply <preset>`.
name: voidflow drift
on:
    push:
        branches: [main]
    schedule:
        - cron: "16 5 * * 1"
    workflow_dispatch:

permissions: {}

jobs:
    drift:
        permissions:
            contents: read
            issues: write # the drift issue
            actions: read # environments
        uses: taraxvoid/voidflow/.github/workflows/voidflow-drift.yml@6debbf253b3514375d712af47d1007546bd7b79a # v1.5.0
